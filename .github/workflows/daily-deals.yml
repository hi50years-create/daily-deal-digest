name: 매일 할인정보 초안 메일 발송

on:
  schedule:
    # KST = UTC+9. 분을 :17로 둔 건 정각(:00)이 붐벼서 지연이 크기 때문.
    # GitHub 무료 스케줄은 수십 분~수시간 늦거나 가끔 통째로 건너뛴다.
    # 그래서 오전(주) + 낮(보조 = 오전 실행이 누락되면 대타 + 낮 딜 포함) 2번 돌린다.
    - cron: '17 0 * * *'   # 한국시간 09:17 (실제 도착은 대개 09:30~11시)
    - cron: '17 3 * * *'   # 한국시간 12:17 (오전 실행 누락 대비 + 오후 타임딜)
  workflow_dispatch: {}  # 수동으로도 실행 가능 (테스트용)

permissions:
  contents: read

jobs:
  send-deal-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          # 아래는 모두 선택 사항 (없으면 기본값/비활성)
          SOURCES: ${{ vars.SOURCES }}
          TELEGRAM_CHANNELS: ${{ vars.TELEGRAM_CHANNELS }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_KEYWORDS: ${{ vars.COUPANG_KEYWORDS }}
        run: python main.py
