name: 매일 할인정보 초안 메일 발송

on:
  schedule:
    # 매일 한국시간 오전 8시 = UTC 전날 23시
    - cron: '0 23 * * *'
  workflow_dispatch: {}  # 수동으로도 실행 가능 (테스트용)

permissions:
  contents: read

jobs:
  send-deal-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          # 아래는 모두 선택 사항 (없으면 기본값/비활성)
          SOURCES: ${{ vars.SOURCES }}
          TELEGRAM_CHANNELS: ${{ vars.TELEGRAM_CHANNELS }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_KEYWORDS: ${{ vars.COUPANG_KEYWORDS }}
          # 커머스 딜의 '진짜 최저가' 대조용 (없으면 대조 생략)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python main.py
